# Lightweight streaming stack for an 8 GB laptop: one Redpanda broker (Kafka API +
# Schema Registry), its console, the feed producer, the stream processor, PostgreSQL
# for live state, and Grafana dashboards. About 2.5 GB of memory in total.

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --default-log-level=warn
    ports:
      - "19092:19092"   # Kafka API (from your Mac)
      - "18081:18081"   # Schema Registry
      - "19644:9644"    # Admin API and Prometheus metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  console:
    image: docker.redpanda.com/redpandadata/console:v3.14.0
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8085:8080"     # web UI at http://localhost:8085
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  producer:
    build: .
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      CONTACT_USER_AGENT: ${CONTACT_USER_AGENT:?Set CONTACT_USER_AGENT in .env}
      POLL_SECONDS: ${POLL_SECONDS:-60}
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  processor:
    build: .
    command: ["python", "-m", "src.processor"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-app}@postgres:5432/public_safety
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
      CONTACT_USER_AGENT: ${CONTACT_USER_AGENT:?Set CONTACT_USER_AGENT in .env}
      CENSUS_VINTAGE: ${CENSUS_VINTAGE:-2023}
      CENSUS_API_KEY: ${CENSUS_API_KEY:-}
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: public_safety
    ports:
      - "15432:5432"    # for psql or a SQL client on your Mac
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "public_safety"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # local only: view dashboards without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/public-safety.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
    ports:
      - "3000:3000"     # dashboards at http://localhost:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  redpanda-data:
  postgres-data:
  grafana-data:
